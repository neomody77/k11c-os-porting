name: Public repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/check-publication.py --history
      - run: python3 -m unittest discover -s tools/tests
      - run: |
          for file in tools/*.sh diagnostics/build.sh; do
            bash -n "$file"
          done
